<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG mock</title>
<style>
@font-face { font-family: Oswald; src: url("../src/assets/fonts/oswald-latin-wght.woff2") format("woff2"); font-weight: 200 700; }
html, body { margin: 0; }
.og { width: 1200px; height: 630px; background: #141414; color: #F7F4EE; font-family: Oswald, sans-serif; text-transform: uppercase; display: grid; grid-template-columns: 1fr 340px; gap: 56px; align-items: center; padding: 0 80px; box-sizing: border-box; position: relative; overflow: hidden; }
.og::after { content: ""; position: absolute; right: -180px; top: -200px; width: 640px; height: 640px; background: radial-gradient(circle, rgba(242,98,46,.35), transparent 65%); }
h1 { font-size: 88px; line-height: .92; margin: 0 0 24px; font-weight: 700; }
.tag { color: #F2622E; font-size: 38px; font-weight: 600; letter-spacing: 2px; margin: 0 0 18px; }
.by { font-size: 28px; letter-spacing: 4px; color: #C9C4BB; margin: 0; }
img { width: 320px; height: 512px; transform: rotate(3deg); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); position: relative; z-index: 1; }
</style></head>
<body><div class="og">
  <div><h1>The Autonomous Enterprise</h1><p class="tag">Human-led, agent-operated.</p><p class="by">Hemanth Reganti</p></div>
  <img src="COVER_SRC" alt="">
</div></body></html>
