<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cover mock</title>
<style>
@font-face { font-family: Oswald; src: url("../src/assets/fonts/oswald-latin-wght.woff2") format("woff2"); font-weight: 200 700; }
html, body { margin: 0; }
.cover { width: 800px; height: 1200px; background: #F2622E; color: #141414; font-family: Oswald, sans-serif; text-transform: uppercase; position: relative; overflow: hidden; box-sizing: border-box; padding: 84px 72px; display: flex; flex-direction: column; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(0,0,0,.08)); }
.bars { display: flex; gap: 14px; align-items: flex-end; height: 120px; margin-bottom: 64px; }
.bars span { width: 38px; background: #141414; }
.title { font-weight: 700; font-size: 116px; line-height: .92; letter-spacing: 0; margin: 0; }
.title .the { display: block; font-size: 64px; font-weight: 600; letter-spacing: 6px; margin-bottom: 12px; }
.rule { height: 8px; width: 140px; background: #141414; margin: 52px 0 40px; }
.sub { font-weight: 500; font-size: 38px; line-height: 1.15; letter-spacing: .5px; max-width: 600px; margin: 0; }
.author { margin-top: auto; font-weight: 600; font-size: 48px; letter-spacing: 6px; }
</style></head>
<body><div class="cover">
  <div class="bars"><span style="height:20%"></span><span style="height:36%"></span><span style="height:52%"></span><span style="height:68%"></span><span style="height:84%"></span><span style="height:100%"></span></div>
  <h1 class="title"><span class="the">The</span>Autonomous<br>Enterprise</h1>
  <div class="rule"></div>
  <p class="sub">How Leaders Build, Govern, and Scale the Agent-Run Company</p>
  <div class="author">Hemanth Reganti</div>
</div></body></html>
