<div class="form-card" id="speaking-form">
  <h3>Book a talk</h3>
  <p class="muted">Tell us about your event. Fields marked <span aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>
  <form class="request-form" action="/api/request" method="post" data-success-title="Thank you. Your speaking request is in." data-success-body="Hemanth will reply to the email address you gave.">
    <div class="form-status" role="alert" tabindex="-1"></div>
    <input type="hidden" name="type" value="speaking">
    <div class="hp" aria-hidden="true">
      <label for="sp-website">Website (leave blank)</label>
      <input type="text" id="sp-website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-grid">
      <div class="field">
        <label for="sp-name">Name<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="sp-name" name="name" autocomplete="name" required minlength="2" maxlength="120" aria-describedby="sp-name-err">
        <span class="field-error" id="sp-name-err"></span>
      </div>
      <div class="field">
        <label for="sp-email">Email<span class="req" aria-hidden="true">*</span></label>
        <input type="email" id="sp-email" name="email" autocomplete="email" required maxlength="254" aria-describedby="sp-email-err">
        <span class="field-error" id="sp-email-err"></span>
      </div>
      <div class="field">
        <label for="sp-organization">Organization<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="sp-organization" name="organization" autocomplete="organization" required maxlength="160" aria-describedby="sp-organization-err">
        <span class="field-error" id="sp-organization-err"></span>
      </div>
      <div class="field">
        <label for="sp-role">Role</label>
        <input type="text" id="sp-role" name="role" autocomplete="organization-title" maxlength="120" aria-describedby="sp-role-err">
        <span class="field-error" id="sp-role-err"></span>
      </div>
      <div class="field">
        <label for="sp-event_name">Event name<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="sp-event_name" name="event_name" required maxlength="160" aria-describedby="sp-event_name-err">
        <span class="field-error" id="sp-event_name-err"></span>
      </div>
      <div class="field">
        <label for="sp-event_date">Event date</label>
        <input type="date" id="sp-event_date" name="event_date" aria-describedby="sp-event_date-err">
        <span class="field-error" id="sp-event_date-err"></span>
      </div>
      <fieldset class="field full" aria-describedby="sp-delivery-err">
        <legend>In person or virtual<span class="req" aria-hidden="true">*</span></legend>
        <div class="options two">
          <label class="option"><input type="radio" name="delivery" value="in-person" required> In person (Dallas&ndash;Fort Worth)</label>
          <label class="option"><input type="radio" name="delivery" value="virtual"> Virtual</label>
        </div>
        <span class="field-error" id="sp-delivery-err"></span>
      </fieldset>
      <div class="field">
        <label for="sp-location">Location</label>
        <input type="text" id="sp-location" name="location" maxlength="160" autocomplete="address-level2" aria-describedby="sp-location-hint sp-location-err">
        <span class="hint" id="sp-location-hint">City and venue, or the platform if virtual.</span>
        <span class="field-error" id="sp-location-err"></span>
      </div>
      <div class="field">
        <label for="sp-audience_size">Audience size</label>
        <select id="sp-audience_size" name="audience_size" aria-describedby="sp-audience_size-err">
          <option value="">Select&hellip;</option>
          <option value="under-50">Under 50</option>
          <option value="50-200">50&ndash;200</option>
          <option value="200-500">200&ndash;500</option>
          <option value="500-1000">500&ndash;1,000</option>
          <option value="over-1000">Over 1,000</option>
        </select>
        <span class="field-error" id="sp-audience_size-err"></span>
      </div>
      <div class="field full">
        <label for="sp-format">Format<span class="req" aria-hidden="true">*</span></label>
        <select id="sp-format" name="format" required aria-describedby="sp-format-err">
          <option value="">Select&hellip;</option>
          <option value="keynote">Keynote</option>
          <option value="panel">Panel</option>
          <option value="fireside-chat">Fireside chat</option>
          <option value="workshop">Workshop</option>
        </select>
        <span class="field-error" id="sp-format-err"></span>
      </div>
      <div class="field full">
        <label for="sp-message">Message<span class="req" aria-hidden="true">*</span></label>
        <textarea id="sp-message" name="message" required minlength="10" maxlength="4000" rows="5" aria-describedby="sp-message-hint sp-message-err"></textarea>
        <span class="hint" id="sp-message-hint">Topic of interest, audience and what you want them to leave with.</span>
        <span class="field-error" id="sp-message-err"></span>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" type="submit">Send speaking request</button>
      <p class="privacy-note">We use your details only to respond to your request.</p>
    </div>
  </form>
</div>
