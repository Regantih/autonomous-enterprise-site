<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="Hemanth Reganti">
<meta name="robots" content="{{ROBOTS}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="theme-color" content="#141414">
<meta name="color-scheme" content="light">
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{SITE_URL}}/assets/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Autonomous Enterprise by Hemanth Reganti: book cover on a dark background">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{SITE_URL}}/assets/images/og-image.jpg">
<meta name="twitter:image:alt" content="The Autonomous Enterprise by Hemanth Reganti: book cover on a dark background">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
{{HEAD_EXTRA}}<link rel="stylesheet" href="/assets/styles.css?v={{ASSET_VERSION}}">
<script src="/assets/site.js?v={{ASSET_VERSION}}" defer></script>
<script src="/assets/guide.js?v={{ASSET_VERSION}}" defer></script>
{{JSONLD}}</head>
<body{{BODY_CLASS}}>
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main" tabindex="-1">
{{BODY}}
</main>
{{> footer}}
{{GUIDE_FAB}}
</body>
</html>
