<div class="form-card" id="advisory-form">
  <h3>Request a consultation</h3>
  <p class="muted">Tell us where your organization is today. Fields marked <span aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>
  <form class="request-form" action="/api/request" method="post" data-success-title="Thank you. Your consultation request is in." data-success-body="Hemanth will reply to the email address you gave.">
    <div class="form-status" role="alert" tabindex="-1"></div>
    <input type="hidden" name="type" value="consultation">
    <div class="hp" aria-hidden="true">
      <label for="co-website">Website (leave blank)</label>
      <input type="text" id="co-website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-grid">
      <div class="field">
        <label for="co-name">Name<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="co-name" name="name" autocomplete="name" required minlength="2" maxlength="120" aria-describedby="co-name-err">
        <span class="field-error" id="co-name-err"></span>
      </div>
      <div class="field">
        <label for="co-email">Email<span class="req" aria-hidden="true">*</span></label>
        <input type="email" id="co-email" name="email" autocomplete="email" required maxlength="254" aria-describedby="co-email-err">
        <span class="field-error" id="co-email-err"></span>
      </div>
      <div class="field">
        <label for="co-organization">Organization<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="co-organization" name="organization" autocomplete="organization" required maxlength="160" aria-describedby="co-organization-err">
        <span class="field-error" id="co-organization-err"></span>
      </div>
      <div class="field">
        <label for="co-role">Role</label>
        <input type="text" id="co-role" name="role" autocomplete="organization-title" maxlength="120" aria-describedby="co-role-err">
        <span class="field-error" id="co-role-err"></span>
      </div>
      <div class="field">
        <label for="co-company_size">Company size</label>
        <select id="co-company_size" name="company_size" aria-describedby="co-company_size-err">
          <option value="">Select&hellip;</option>
          <option value="under-500">Under 500 employees</option>
          <option value="500-5000">500&ndash;5,000 employees</option>
          <option value="5000-25000">5,000&ndash;25,000 employees</option>
          <option value="over-25000">Over 25,000 employees</option>
        </select>
        <span class="field-error" id="co-company_size-err"></span>
      </div>
      <div class="field">
        <label for="co-timeline">Timeline</label>
        <select id="co-timeline" name="timeline" aria-describedby="co-timeline-err">
          <option value="">Select&hellip;</option>
          <option value="now">Ready to start now</option>
          <option value="1-3-months">In 1&ndash;3 months</option>
          <option value="3-6-months">In 3&ndash;6 months</option>
          <option value="exploring">Exploring options</option>
        </select>
        <span class="field-error" id="co-timeline-err"></span>
      </div>
      <fieldset class="field full" aria-describedby="co-goals-err">
        <legend>Goals<span class="req" aria-hidden="true">*</span> <span class="hint">(choose all that apply)</span></legend>
        <div class="options two">
          <label class="option"><input type="checkbox" name="goals" value="readiness-assessment"> Autonomy readiness assessment</label>
          <label class="option"><input type="checkbox" name="goals" value="governance-guardrails"> Governance and guardrail design</label>
          <label class="option"><input type="checkbox" name="goals" value="operating-model"> Operating-model changes</label>
          <label class="option"><input type="checkbox" name="goals" value="business-case-roadmap"> Business case and 30-month roadmap</label>
          <label class="option"><input type="checkbox" name="goals" value="other"> Something else</label>
        </div>
        <span class="field-error" id="co-goals-err"></span>
      </fieldset>
      <div class="field full">
        <label for="co-message">Message</label>
        <textarea id="co-message" name="message" maxlength="4000" rows="5" aria-describedby="co-message-hint co-message-err"></textarea>
        <span class="hint" id="co-message-hint">Where you are with AI agents today and what you want to decide.</span>
        <span class="field-error" id="co-message-err"></span>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" type="submit">Send consultation request</button>
      <p class="privacy-note">We use your details only to respond to your request.</p>
    </div>
  </form>
</div>
