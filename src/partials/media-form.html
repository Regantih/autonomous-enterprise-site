<div class="form-card" id="media-form">
  <h3>Media and podcasts</h3>
  <p class="muted">Interview, podcast or article request. Fields marked <span aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>
  <form class="request-form" action="/api/request" method="post" data-success-title="Thank you. Your media request is in." data-success-body="Hemanth will reply to the email address you gave.">
    <div class="form-status" role="alert" tabindex="-1"></div>
    <input type="hidden" name="type" value="media">
    <div class="hp" aria-hidden="true">
      <label for="me-website">Website (leave blank)</label>
      <input type="text" id="me-website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-grid">
      <div class="field">
        <label for="me-name">Name<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="me-name" name="name" autocomplete="name" required minlength="2" maxlength="120" aria-describedby="me-name-err">
        <span class="field-error" id="me-name-err"></span>
      </div>
      <div class="field">
        <label for="me-email">Email<span class="req" aria-hidden="true">*</span></label>
        <input type="email" id="me-email" name="email" autocomplete="email" required maxlength="254" aria-describedby="me-email-err">
        <span class="field-error" id="me-email-err"></span>
      </div>
      <div class="field">
        <label for="me-outlet">Outlet<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="me-outlet" name="outlet" autocomplete="organization" required maxlength="160" aria-describedby="me-outlet-hint me-outlet-err">
        <span class="hint" id="me-outlet-hint">Publication, podcast or show.</span>
        <span class="field-error" id="me-outlet-err"></span>
      </div>
      <div class="field">
        <label for="me-deadline">Deadline</label>
        <input type="date" id="me-deadline" name="deadline" aria-describedby="me-deadline-err">
        <span class="field-error" id="me-deadline-err"></span>
      </div>
      <div class="field full">
        <label for="me-topic">Topic<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="me-topic" name="topic" required maxlength="200" aria-describedby="me-topic-err">
        <span class="field-error" id="me-topic-err"></span>
      </div>
      <div class="field full">
        <label for="me-message">Message<span class="req" aria-hidden="true">*</span></label>
        <textarea id="me-message" name="message" required minlength="10" maxlength="4000" rows="5" aria-describedby="me-message-hint me-message-err"></textarea>
        <span class="hint" id="me-message-hint">Format, length, audience and recording or publication date.</span>
        <span class="field-error" id="me-message-err"></span>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" type="submit">Send media request</button>
      <p class="privacy-note">We use your details only to respond to your request.</p>
    </div>
  </form>
</div>
